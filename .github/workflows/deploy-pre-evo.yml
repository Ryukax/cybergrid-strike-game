name: Deploy CyberGrid Strike with Branch Preview

on:
  push:
    branches:
      - main
      - agent/cybergrid-strike-branch
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source
      - name: Checkout branch preview
        uses: actions/checkout@v4
        with:
          ref: agent/cybergrid-strike-branch
          path: branch-source
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.26.1'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: |
            main-source/pnpm-lock.yaml
            branch-source/pnpm-lock.yaml
      - name: Install main dependencies
        working-directory: main-source
        run: pnpm install --frozen-lockfile
      - name: Build main
        working-directory: main-source
        run: pnpm --filter @workspace/cybergrid-strike-pre-evo run build
        env:
          PORT: '3000'
          BASE_PATH: '/cybergrid-strike-game/'
          NODE_ENV: 'production'
      - name: Install branch dependencies
        working-directory: branch-source
        run: pnpm install --frozen-lockfile
      - name: Build branch preview
        working-directory: branch-source
        run: pnpm --filter @workspace/cybergrid-strike-pre-evo run build
        env:
          PORT: '3000'
          BASE_PATH: '/cybergrid-strike-game/branch/'
          NODE_ENV: 'production'
      - name: Assemble Pages site
        shell: bash
        run: |
          mkdir -p pages-site/branch
          cp -R main-source/artifacts/cybergrid-strike-pre-evo/dist/public/. pages-site/
          cp -R branch-source/artifacts/cybergrid-strike-pre-evo/dist/public/. pages-site/branch/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
