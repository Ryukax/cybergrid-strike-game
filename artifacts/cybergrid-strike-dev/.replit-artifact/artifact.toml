kind = "web"
previewPath = "/cybergrid-strike-dev/"
title = "CyberGrid Strike (Dev)"
version = "1.0.0"
id = "artifacts/cybergrid-strike-dev"
router = "path"

[[services]]
name = "web"
paths = [ "/cybergrid-strike-dev/" ]
localPort = 23873

[services.development]
run = "pnpm --filter @workspace/cybergrid-strike-dev run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cybergrid-strike-dev", "run", "build" ]
serve = "static"
publicDir = "artifacts/cybergrid-strike-dev/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23873"
BASE_PATH = "/cybergrid-strike-dev/"
